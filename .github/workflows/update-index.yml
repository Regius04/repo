name: Aggiorna Index HTML

on:
  push:
    paths:
      - '*.zip' # Si attiva solo se aggiungi o modifichi un file .zip nella root

permissions:
  contents: write # Permette all'azione di modificare i file nella repo

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
    - name: Controlla il codice della repo
      uses: actions/checkout@v4

    - name: Rigenera i link nel file index.html
      run: |
        # Inizio del file HTML (paga base)
        echo "<!DOCTYPE html>" > index.html
        echo "<html lang='it'>" >> index.html
        echo "<head><meta charset='UTF-8'><title>Download Files</title></head>" >> index.html
        echo "<body>" >> index.html
        echo "<h1>Lista File Disponibili</h1>" >> index.html
        
        # Cerca tutti i file .zip e crea il tag <a> per ognuno
        for file in *.zip; do
          if [ -f "$file" ]; then
            echo "  <a href=\"$file\">$file</a><br>" >> index.html
          fi
        done
        
        # Chiusura del file HTML
        echo "</body>" >> index.html
        echo "</html>" >> index.html

    - name: Commit e Push delle modifiche
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add index.html
        # Esegue il commit solo se ci sono effettive modifiche
        git diff-index --quiet HEAD || git commit -m "Automated: update index.html with new zip links"
        git push
